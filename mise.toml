[tools]
go = "1.27.3"
tmux = "latest"   # needed by the tests; a private socket keeps them off any real server
protoc = "latest"
protoc-gen-go = "latest"

[tasks.test]
description = "Unit tests and tmux end-to-end tests on a private socket (the iTerm2 test is opt-in)"
run = "go test ./..."

[tasks."test:iterm"]
description = "Run the opt-in iTerm2 acceptance test: opens one scratch tab and closes it"
env = { TERMCTL_ITERM_TEST = "1" }
run = "go test ./e2e -run TestClearFirstOnITerm2 -v -count=1"

[tasks.check]
description = "Tests plus OKF validation"
depends = ["test"]
run = 'uv run "$HOME/.claude/skills/validate/scripts/okf_validate.py" .okf --strict'

[tasks.install]
description = "Build termctl and harness-ops into ~/.local/bin"
run = 'go build -o "$HOME/.local/bin/" ./cmd/harness-ops ./cmd/termctl'

[tasks.proto]
description = "Regenerate the iTerm2 API messages from internal/iterm2api/api.proto"
run = "protoc --go_out=. --go_opt=paths=source_relative --proto_path=. internal/iterm2api/api.proto"
