[project]
name = "termctl"
version = "0.1.0"
description = "Terminal driver with backends (iTerm2, tmux, Rex) plus a harness-ops layer that talks to coding-agent TUIs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["iterm2==2.30"]

[project.scripts]
termctl = "termctl.cli:entry"
harness-ops = "termctl.harness.cli:entry"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/termctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
